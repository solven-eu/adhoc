# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Static Analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions: read-all

jobs:
  build:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'
    # Workflow-scoped cache avoids cross-workflow cache pollution.
    # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
    - name: Cache Maven local repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.m2/repository
        key: maven-static-analysis-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-static-analysis-${{ runner.os }}-
    - name: Check with Static tools (PMD, checkstyle, SpotBugs)
      run: mvn package -DskipTests -Dspotless.skip=true --file pom.xml --batch-mode
    # Error Prone is wired as an opt-in Maven profile; see CONVENTIONS.MD § "Error Prone static analysis"
    # and the `errorprone` profile in pom.xml for the full configuration. `-Pfast` skips tests and the
    # slow static checks already covered by the step above (PMD, Checkstyle, SpotBugs, Spotless); we
    # only want EP's findings here. Findings currently surface as `[WARNING]` lines thanks to
    # `-XepAllErrorsAsWarnings`, so this step never reddens the build on its own — drop that flag in
    # pom.xml to make the step fail on EP violations once the codebase is clean.
    #
    # `adhoc-jmh` is excluded because its `src/main` benchmarks compile-link a test-jar classifier
    # (`adhoc-fsst:tests`, used by FsstEncodeBenchmark). `mvn clean compile` does not run the
    # `package` phase, so the referenced test-jar is never produced during this step and the
    # compile would fail at resolution. Benchmarks do not benefit meaningfully from Error Prone
    # checks anyway.
    - name: Error Prone
      run: mvn clean compile --file pom.xml --batch-mode -Perrorprone,fast -pl '!:adhoc-jmh' -am
