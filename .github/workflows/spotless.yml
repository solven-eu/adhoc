# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Spotless

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions: read-all

jobs:
  build:
    name: Spotless
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'
    # Workflow-scoped cache avoids cross-workflow cache pollution.
    # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
    - name: Cache Maven local repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.m2/repository
        key: maven-spotless-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-spotless-${{ runner.os }}-
    #- name: Download dependencies
    #  # This is useful not to clutter the package command with download logs
    #  run: mvn dependency:resolve dependency:resolve-plugins --batch-mode
    - name: Check with Spotless
      run: mvn spotless:check --file pom.xml --batch-mode
