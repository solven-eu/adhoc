# Generates a CycloneDX SBOM via the cyclonedx-maven-plugin (auto-bound makeAggregateBom
# at the `package` phase) and scans it with Grype for known vulnerabilities. The root-level
# aggregate BOM lives at target/classes/META-INF/sbom/application.cdx.json. Results are
# uploaded as a SARIF file so they appear in the GitHub Security → Code scanning tab.
#
# Runs on every push to master and on every PR targeting master.

name: SBOM + Grype vulnerability scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  security-events: write   # needed by github/codeql-action/upload-sarif

jobs:
  grype:
    name: Generate SBOM & scan with Grype
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Maven local repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.m2/repository
        key: maven-grype-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-grype-${{ runner.os }}-

    # Generate the SBOM. -Pfast skips tests and static analysis; the cyclonedx plugin
    # is bound to the `package` phase via its default execution so `verify` covers it.
    # JaCoCo is skipped explicitly
    # because -Pfast sets maven.test.skip but JaCoCo's check goal still runs.
    # cyclonedx.skip=false re-enables the SBOM generation that -Pfast now disables
    # by default (see CHANGES.MD for 0.0.19).
    - name: Generate CycloneDX SBOM
      run: mvn verify -Pfast -Djacoco.skip=true -Dcyclonedx.skip=false --file pom.xml --batch-mode

    - name: Scan SBOM with Grype
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      id: grype
      with:
        sbom: target/classes/META-INF/sbom/application.cdx.json
        fail-build: false          # advisory: don't block PRs yet, just surface findings
        output-format: sarif

    # Workaround for https://github.com/anchore/grype/issues/2235 — Grype omits
    # `physicalLocation.artifactLocation.uri` in SARIF when scanning an SBOM
    # (packages have no on-disk path; Grype emits `logicalLocations` instead, or
    # leaves `artifactLocation` absent/empty). GitHub Code Scanning rejects the
    # upload with `locationFromSarifResult: expected artifact location`. We
    # force-set a stub URI pointing at the SBOM itself on every result location,
    # creating intermediate objects as needed and preserving any pre-existing URI.
    - name: Patch SARIF artifactLocation (Grype #2235)
      run: |
        jq '.runs[]?.results[]?.locations |= (map(. + {physicalLocation: ((.physicalLocation // {}) + {artifactLocation: ((.physicalLocation.artifactLocation // {}) + {uri: (if ((.physicalLocation.artifactLocation.uri // "") == "") then "target/classes/META-INF/sbom/application.cdx.json" else .physicalLocation.artifactLocation.uri end)})})}))' \
          "${{ steps.grype.outputs.sarif }}" > /tmp/patched.sarif
        mv /tmp/patched.sarif "${{ steps.grype.outputs.sarif }}"

    - name: Upload Grype SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        sarif_file: ${{ steps.grype.outputs.sarif }}
