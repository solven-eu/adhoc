name: JS Unit (ViTest) Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions: read-all

jobs:
  test:
    name: JS Unit (ViTest) Tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    # Package the server to serve API and JS
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'
    # Workflow-scoped cache avoids cross-workflow cache pollution.
    # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
    - name: Cache Maven local repository
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.m2/repository
        key: maven-js-unit-tests-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-js-unit-tests-${{ runner.os }}-
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: lts/*
    - name: Install NPM dependencies
      working-directory: ./pivotable/js
      run: npm ci
    # `tsc --noEmit` gates files that have opted in via `// @ts-check`. The project ships
    # `checkJs: false`, so this step is a no-op until contributors add the directive; once they do,
    # mismatched JSDoc types or undeclared globals will break this job in CI.
    - name: Run TypeScript JSDoc check
      working-directory: ./pivotable/js
      run: npm run tsc_check
    - name: Run ViTest tests
      working-directory: ./pivotable/js
      run: npm run unit_tests_ci
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: vitest-report
        path: pivotable/js/vitest-report/
        retention-days: 30
