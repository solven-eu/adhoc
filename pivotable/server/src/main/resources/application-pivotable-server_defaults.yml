# Reasonnable default server configuration, generally useful for Pivotable

spring:
    application.name: pivotable-server
    graphql:
        graphiql:
            enabled: true

server:
  # https://stackoverflow.com/questions/55237276/how-to-return-gzip-responses-with-spring-webflux
  compression:
    enabled: true
    mime-types: application/json, application/hal+json
    min-response-size: 1024
  # https://stackoverflow.com/questions/53810900/why-there-is-no-exception-stack-trace-in-spring-webflux-with-default-configurati
  error.includeStacktrace: ALWAYS

# Relates with ApplicationPidFileWriter
spring.pid.fail-on-write-error:
  true

springdoc.show-actuator: true

# https://stackoverflow.com/questions/55877188/spring-boot-actuator-returns-404-not-found
# `threaddump` is exposed for operator diagnostics — the SPA surfaces a "Thread dump" button
# in the endpoint header that fetches the text/plain rendering for easy inspection in the
# browser. The endpoint is protected by `PivotableJwtWebfluxSecurity`'s default-deny rule
# (only `/actuator`, `/actuator/health/**`, `/actuator/info` are in the permitAll list), so a
# logged-out caller gets a 401 just like any other protected /api/v1/** route.
management.endpoints.web.exposure.include: health,info,beans,threaddump


management:
  endpoint:
    health:
      show-details: always